name: Checks

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  workflow_dispatch:
  # The release build (electron-build.yml) runs these first.
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    env:
      # Nothing here starts Electron, so its binary is not needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check the app
        run: npx tsc --noEmit -p tsconfig.json

      - name: Type-check the desktop main process
        run: npx tsc --noEmit -p electron/tsconfig.json

      - name: Unit tests (desktop main process)
        run: npm run test:electron

      # Fails on a known high or critical vulnerability in the packages the
      # app ships (dependencies, not devDependencies). Build and lint tools are
      # left to `npm ci`'s summary above. Once is enough: the tree is the same
      # on both systems.
      - name: Audit shipped dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev --audit-level=high
